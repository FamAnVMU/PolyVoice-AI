name: polyvoice_ai
description: "PolyVoice AI - Lightweight, zero-server-cost (BYOK) conversational chat and real-time voice assistant"
publish_to: 'none'
version: 1.0.5+6

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Secure & Local Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2

  # Networking & HTTP Streaming
  dio: ^5.7.0

  # Voice Pipeline
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.2
  record: ^5.2.0
  permission_handler: ^11.3.1
  path_provider: ^2.1.4

  # UI & Markdown
  flutter_markdown: ^0.7.4+1
  cupertino_icons: ^1.0.8
  uuid: ^4.5.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

dependency_overrides:
  record_linux: ^1.3.1
