plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    namespace "com.polyvoice.polyvoice_ai"
    compileSdk 36
    ndkVersion "25.1.8937393"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.polyvoice.polyvoice_ai"
        minSdkVersion 24
        targetSdkVersion 34
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        release {
            def keystoreFile = file('release-keystore.jks')
            def envKeystoreBase64 = System.getenv('KEYSTORE_BASE64')

            if (envKeystoreBase64 != null && !envKeystoreBase64.isEmpty()) {
                def decodedBytes = envKeystoreBase64.decodeBase64()
                keystoreFile = file("${buildDir}/decoded-release-keystore.jks")
                keystoreFile.parentFile.mkdirs()
                keystoreFile.bytes = decodedBytes
            }

            def keyPropertiesFile = rootProject.file('key.properties')
            def keyProperties = new Properties()
            if (keyPropertiesFile.exists()) {
                keyPropertiesFile.withReader('UTF-8') { reader ->
                    keyProperties.load(reader)
                }
            }

            def configuredPath = keyProperties.getProperty('storeFile')
            if (configuredPath != null) {
                keystoreFile = file(configuredPath)
            }

            if (keystoreFile.exists()) {
                storeFile keystoreFile
                storePassword System.getenv('KEYSTORE_PASSWORD') ?: keyProperties.getProperty('storePassword') ?: 'polyvoice123'
                keyAlias System.getenv('KEY_ALIAS') ?: keyProperties.getProperty('keyAlias') ?: 'polyvoice'
                keyPassword System.getenv('KEY_PASSWORD') ?: keyProperties.getProperty('keyPassword') ?: 'polyvoice123'
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release.storeFile != null ? signingConfigs.release : signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
        debug {
            signingConfig signingConfigs.release.storeFile != null ? signingConfigs.release : signingConfigs.debug
        }
    }
}

flutter {
    source '../..'
}

dependencies {}
