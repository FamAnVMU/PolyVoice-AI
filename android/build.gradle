allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'

// Global flutter fallback properties for any plugin subprojects (including :jni and :record_android)
allprojects {
    project.ext.flutter = [
        compileSdkVersion: 36,
        targetSdkVersion: 34,
        minSdkVersion: 24,
        ndkVersion: "25.1.8937393"
    ]
}

subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
    project.ext.flutter = [
        compileSdkVersion: 36,
        targetSdkVersion: 34,
        minSdkVersion: 24,
        ndkVersion: "25.1.8937393"
    ]

    def configureAndroid = {
        if (project.hasProperty('android')) {
            project.android {
                if (namespace == null) {
                    namespace project.group
                }
                compileSdkVersion 36
                buildToolsVersion "36.0.0"
                try {
                    ndkVersion "25.1.8937393"
                } catch (Exception e) {}
            }
        }
    }

    if (project.state.executed) {
        configureAndroid()
    } else {
        project.afterEvaluate {
            configureAndroid()
        }
    }
}

subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
