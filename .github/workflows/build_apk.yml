name: Build Android APK & GitHub Release (PolyVoice AI)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Decode Release Keystore (from GitHub Secrets if configured)
        shell: bash
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding Keystore from secret KEYSTORE_BASE64..."
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release-keystore.jks
          fi
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build Release APK
        run: flutter build apk --release --android-skip-build-dependency-validation
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Prepare Named APK
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME}"
          if [ -z "$VERSION" ]; then
            # Extract version directly from pubspec.yaml if triggered via branch push or manual dispatch
            VERSION="v$(grep '^version: ' pubspec.yaml | sed 's/version: //; s/+.*//')"
          fi
          # Ensure consistent format PolyVoice-AI-vX.Y.Z.apk
          case "$VERSION" in
            v*) FORMATTED_NAME="PolyVoice-AI-${VERSION}.apk" ;;
            *)  FORMATTED_NAME="PolyVoice-AI-v${VERSION}.apk" ;;
          esac
          cp build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/${FORMATTED_NAME}"
          rm -f build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PolyVoice-AI-Release-APK
          path: build/app/outputs/flutter-apk/PolyVoice-AI-*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/PolyVoice-AI-*.apk
          name: PolyVoice AI Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
